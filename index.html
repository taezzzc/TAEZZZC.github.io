body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333;min-height:100vh;font-size:14px}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);color:#fff;padding:14px 12px;text-align:center;position:sticky;top:0;z-index:100}
.header h1{font-size:22px;font-weight:800;letter-spacing:2px}
.header .sub{font-size:10px;opacity:0.7;margin-top:2px}
.container{max-width:720px;margin:0 auto;padding:8px}
.ai-panel{background:linear-gradient(135deg,#1a0533,#2d1b69,#0f3460);border-radius:12px;padding:12px;margin-bottom:10px;color:#fff;position:relative;overflow:hidden}

.ai-panel::after{content:'';position:absolute;bottom:-20px;left:-20px;width:60px;height:60px;background:rgba(255,215,0,0.06);border-radius:50%}
.ai-panel-title{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;position:relative;z-index:1}
.ai-recs{display:flex;gap:6px;flex-wrap:wrap;position:relative;z-index:1}
.ai-rec-card{flex:1;min-width:95px;background:rgba(255,255,255,0.08);border-radius:8px;padding:8px;text-align:center;border:1px solid rgba(255,255,255,0.1)}
.ai-rec-card .rec-type{font-size:9px;opacity:0.7;margin-bottom:3px}
.ai-rec-card .rec-match{font-size:11px;font-weight:600}
.ai-rec-card .rec-pick{font-size:14px;font-weight:800;color:#ffd700;margin:3px 0}
.ai-rec-card .rec-sp{font-size:10px;opacity:0.8}
.ai-rec-card .rec-reason{font-size:8px;opacity:0.6;margin-top:1px}
.rec-safe{border-left:3px solid #4caf50}
.rec-cold{border-left:3px solid #ff9800}
.rec-score{border-left:3px solid #2196f3}
.tab-bar{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:5px 9px;border:1px solid #ddd;background:#fff;border-radius:14px;font-size:10px;cursor:pointer;color:#666;white-space:nowrap;min-height:28px;transition:all .15s}
.tab-btn.active{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.quick-row{display:flex;gap:6px;align-items:center;font-size:12px;color:#666;flex-wrap:wrap;margin-bottom:6px}

.quick-row label input{width:14px;height:14px;accent-color:#d4213d}
.quick-btn{min-height:28px;border:1px solid #ddd;background:#fff;padding:3px 10px;border-radius:14px;font-size:11px;cursor:pointer;color:#666;white-space:nowrap;transition:all .15s}
.quick-btn.active{background:#d4213d;color:#fff;border-color:#d4213d}
.selected-count{font-size:12px;color:#d4213d;font-weight:600;margin-bottom:4px;background:#fff0f0;display:inline-block;padding:2px 10px;border-radius:10px}
.match-card{background:#fff;border:1px solid #eee;border-radius:8px;padding:10px;margin-bottom:8px;transition:all .2s}
.match-card.past-card{background:#fafafa;border-color:#e8e8e8;opacity:0.75}
.past-score{text-align:center;padding:8px 0;margin-bottom:8px;border-bottom:1px dashed #e0e0e0}
.past-score .final-score{font-size:24px;font-weight:800;color:#1a1a2e;letter-spacing:2px}
.past-score .ht-score{font-size:11px;color:#999;margin-top:2px}
.past-result-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:3px 0;padding:2px 4px}
.past-result-label{font-size:10px;color:#888;font-weight:700;min-width:36px}
.past-result-opts{display:flex;gap:4px;flex-wrap:wrap}
.past-opt{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:6px;font-size:10px;border:1px solid #e8e8e8;background:#f5f5f5;color:#bbb}
.past-opt.hit{background:#e8f5e9;color:#2e7d32;border-color:#a5d6a7;font-weight:700}
.past-opt.hit .past-sp{color:#2e7d32}
.match-card-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.match-card .chk-col{flex-shrink:0;padding-top:2px}
.match-card .chk-col input{width:18px;height:18px;accent-color:#d4213d;cursor:pointer}
.match-card .info-col{flex:1;min-width:0}
.match-card .info-row1{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.match-card .match-id{font-size:11px;font-weight:700;padding:2px 6px;border-radius:3px;flex-shrink:0;background:#f5f5f5}
.match-card .match-league{font-size:10px;color:#999}
.match-card .match-teams{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match-card .info-row2{display:flex;align-items:center;gap:8px;font-size:11px;flex-wrap:wrap}
.match-card .match-time{color:#d4213d;font-weight:600}
.match-card .match-note{color:#999;font-size:10px}
.match-card .info-row3{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.score-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.score-badge.high{background:#e8f5e9;color:#2e7d32}
.score-badge.mid{background:#fff3e0;color:#e65100}
.score-badge.low{background:#ffebee;color:#c62828}
.alert-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:10px;font-size:10px;font-weight:600}
.alert-hot{background:#ffebee;color:#d4213d}
.alert-cold{background:#e3f2fd;color:#1976d2}
.alert-none{background:#f5f5f5;color:#999}
.prob-badge{font-size:10px;padding:2px 6px;border-radius:8px;font-weight:600}
.prob-high{background:#e8f5e9;color:#2e7d32}
.prob-mid{background:#fff8e1;color:#f57f17}
.prob-low{background:#fce4ec;color:#c62828}
.match-card .mode-row{display:none}
.match-card .mode-select{display:none}
.match-card .sp-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-left:2px}
.sp-section{margin-bottom:3px;padding:3px 0}
.sp-section-label{font-size:10px;color:#999;font-weight:600;margin-bottom:1px;padding:0 4px}
.analysis-toggle{font-size:10px;color:#888;cursor:pointer;display:flex;align-items:center;gap:3px;margin-top:6px;padding:4px 8px;background:#f8f8f8;border-radius:6px;border:none;width:100%;text-align:left}
.analysis-toggle:hover{background:#eee}
.expand-btn{font-size:10px;color:#888;cursor:pointer;display:flex;align-items:center;gap:4px;margin-top:4px;padding:4px 8px;background:#fafafa;border-radius:6px;border:1px dashed #ddd;width:100%;text-align:left;transition:all .15s}
.expand-btn:hover{background:#f0f0f0;border-color:#bbb}
.expand-section{display:none;border-left:2px solid #e8e8e8;margin-left:6px;padding-left:6px}
.analysis-detail{display:none;margin-top:8px;padding:10px;background:#fafafa;border-radius:6px;font-size:11px;line-height:1.8}
.analysis-detail.show{display:block}
.analysis-table{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:8px}
.analysis-table th{background:#eee;padding:4px 6px;text-align:center;font-weight:600}
.analysis-table td{padding:4px 6px;text-align:center;border-bottom:1px solid #eee}
.per-match-rec{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}

function perMatchRecommendations(m){

else{h+='<div class="result-row"><span>SP乘积</span><span style="font-size:16px;">'+bs[0].toFixed(4)+'</span></div><div class="result-row"><span>单注金额</span><span>¥2.00</span></div><div class="result-row"><span>倍投</span><span><input type="number" id="multiplier" value="1" min="1" max="99" style="width:56px;padding:4px;text-align:center;border:1px solid #ddd;border-radius:4px;font-size:14px;" oninput="recalcMulti()"> 倍</span></div><div class="result-row total"><span>预计奖金</span><span id="prizeDisplay">¥'+mx.toFixed(2)+'</span></div><div style="font-size:11px;color:#888;">'+(n===1?"单关返奖":"全部猜中方中奖")+' | 投入 ¥<span id="totalDisplay">2.00</span></div>';if(mx>10000)h+='<div style="color:#d4213d;font-size:10px;margin-top:4px;">单注奖金超1万元需缴20%偶然所得税</div>'}
h+="</div>";if(ml.length>0)h+='<div style="margin-top:8px;font-size:10px;color:#999;">'+ml.join("<br>")+"</div>";document.getElementById("resultContent").innerHTML=h}

function recalcMulti(){var m=parseInt(document.getElementById("multiplier").value)||1;if(window._combos&&window._combos.length>1){var mn=1e9,mx=0;for(var i=0;i<window._combos.length;i++){var p=2*window._baseSPs[i]*m;if(p<mn)mn=p;if(p>mx)mx=p}document.getElementById("minPrizeDisp").textContent="¥"+mn.toFixed(2);document.getElementById("maxPrizeDisp").textContent="¥"+mx.toFixed(2);document.getElementById("totalCostDisp").textContent="¥"+(2*window._combos.length*m).toFixed(2);document.getElementById("totalDisplay").textContent=(2*window._combos.length*m).toFixed(2)}else{var sp=window._baseSPs?window._baseSPs[0]:1;document.getElementById("prizeDisplay").textContent="¥"+(2*sp*m).toFixed(2);document.getElementById("totalDisplay").textContent=(2*m).toFixed(2)}}

function resetAll(){document.querySelectorAll(".match-check").forEach(function(c){c.checked=false});document.querySelectorAll(".match-card").forEach(function(c){c.classList.remove("selected-card")});document.querySelectorAll(".check-opt").forEach(function(c){c.classList.remove("selected")});renderAll();document.getElementById("resultContent").innerHTML='<p class="tip">点击选项自动选场，选择后点击「计算奖金」</p>';window._combos=null;window._baseSPs=null}

renderTabs();renderAll();
</script>
