<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竞彩足球混合串关计算器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333;min-height:100vh}
.header{background:linear-gradient(135deg,#d4213d,#b81c34);color:#fff;padding:16px 12px;text-align:center}
.header h1{font-size:17px;font-weight:700;margin-bottom:2px}
.header .sub{font-size:11px;opacity:0.85;margin-bottom:4px}
.header .notice{font-size:10px;background:rgba(255,255,255,0.16);display:inline-block;padding:4px 12px;border-radius:10px;line-height:1.5}
.container{max-width:720px;margin:10px auto;padding:0 8px}
.card{background:#fff;border-radius:8px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.card-title{font-size:14px;font-weight:700;margin-bottom:10px;color:#d4213d;border-left:3px solid #d4213d;padding-left:8px}

/* Date tabs — scrollable on mobile */
.tab-bar{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:5px 10px;border:1px solid #ddd;background:#fff;border-radius:14px;font-size:11px;cursor:pointer;transition:all .15s;color:#666;white-space:nowrap;min-height:30px}
.tab-btn:hover{border-color:#d4213d;color:#d4213d}
.tab-btn.active{background:#d4213d;color:#fff;border-color:#d4213d}
.tab-btn .count{font-size:9px;opacity:0.7}

.quick-row{display:flex;gap:6px;align-items:center;font-size:12px;color:#666;flex-wrap:wrap;margin-bottom:4px}
.quick-row label{cursor:pointer;display:flex;align-items:center;gap:2px;font-size:12px}
.quick-row label input{width:14px;height:14px;accent-color:#d4213d}
.quick-btn{min-height:30px;border:1px solid #ddd;background:#fff;padding:4px 10px;border-radius:14px;font-size:12px;cursor:pointer;transition:all .15s;color:#666;white-space:nowrap}
.quick-btn:hover{border-color:#d4213d;color:#d4213d}
.quick-btn.active{background:#d4213d;color:#fff;border-color:#d4213d}
.selected-count{font-size:12px;color:#d4213d;font-weight:600;margin-bottom:6px;background:#fff0f0;display:inline-block;padding:2px 10px;border-radius:10px}

/* Table — hidden on mobile, match cards used instead */
.table-header{display:none}

/* Match card */
.match-card{background:#fff;border:1px solid #eee;border-radius:8px;padding:10px;margin-bottom:8px;position:relative}
.match-card.selected-card{border-color:#d4213d;background:#fffafb}
.match-card-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.match-card .chk-col{flex-shrink:0;padding-top:2px}
.match-card .chk-col input{width:18px;height:18px;accent-color:#d4213d;cursor:pointer}
.match-card .info-col{flex:1;min-width:0}
.match-card .info-row1{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.match-card .match-id{font-size:11px;font-weight:700;color:#d4213d;background:#ffebee;padding:1px 6px;border-radius:3px;flex-shrink:0}
.match-card .match-league{font-size:10px;color:#999;flex-shrink:0}
.match-card .match-teams{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match-card .info-row2{display:flex;align-items:center;gap:8px;font-size:11px}
.match-card .match-time{color:#d4213d;font-weight:600;flex-shrink:0}
.match-card .match-note{color:#999;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match-card .mode-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.match-card .mode-row .mode-select{flex:1;max-width:140px;padding:6px 4px;border:1px solid #ccc;border-radius:5px;font-size:12px;outline:none;background:#fff;cursor:pointer}
.match-card .mode-select:focus{border-color:#d4213d}
.match-card .sp-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* SP option buttons */
.check-opt{display:inline-flex;align-items:center;gap:3px;cursor:pointer;padding:6px 9px;border:1px solid #e0e0e0;border-radius:6px;font-size:12px;transition:all .15s;background:#fff;white-space:nowrap;user-select:none;min-height:34px;touch-action:manipulation}
.check-opt:hover,.check-opt:active{border-color:#d4213d;background:#fff8f8}
.check-opt input{display:none}
.check-opt .sp-val{font-weight:700;color:#1976d2;font-size:13px}
.check-opt.selected{border-color:#d4213d;background:#fff0f0;box-shadow:0 0 0 1px #d4213d}
.check-opt .label{color:#555;font-size:11px}
.check-opt.selected .label{color:#d4213d}
.check-opt.selected .sp-val{color:#d4213d}

.sp-text-input{padding:6px 6px;border:1px solid #ddd;border-radius:5px;font-size:12px;text-align:center;width:65px;outline:none;min-height:34px}
.sp-text-input:focus{border-color:#d4213d}

.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600}
.badge-red{background:#ffebee;color:#d4213d}
.badge-blue{background:#e3f2fd;color:#1976d2}
.badge-orange{background:#fff3e0;color:#e65100}
.badge-green{background:#e8f5e9;color:#2e7d32}

.result-box{background:#f9f9f9;border-radius:8px;padding:14px;margin-top:10px}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px}
.result-row.total{font-size:18px;font-weight:700;color:#d4213d;border-top:1px solid #eee;padding-top:10px;margin-top:4px}
.result-label{color:#888}
.result-value{font-weight:600}

.btn{padding:12px 20px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;min-height:44px;touch-action:manipulation}
.btn-primary{background:#d4213d;color:#fff;width:100%;margin-top:10px;font-size:16px}
.btn-primary:hover,.btn-primary:active{background:#b81c34}
.btn-reset{background:#f5f5f5;color:#666;width:100%;margin-top:6px}
.btn-reset:hover,.btn-reset:active{background:#e0e0e0}

.footer{text-align:center;padding:14px;color:#999;font-size:10px}
.footer p{margin:1px 0}
.tip{font-size:12px;color:#999;margin-top:4px}
.source-note{font-size:9px;color:#bbb;margin-top:4px}
.detail-line{font-size:11px;line-height:1.8;padding:8px 10px;background:#f9f9f9;border-radius:6px;margin-bottom:8px;word-break:break-all}
.empty-tab{text-align:center;padding:40px;color:#bbb;font-size:14px}
</style>
</head>

var currentTab = "2026-07-30";
var currentMode = "spf";

var modes = {
    spf:{name:"胜平负",labels:["胜","平","负"]},
    rqspf:{name:"让球胜平负",labels:["让胜","让平","让负"]},
    bf:{name:"比分",labels:["比分","SP"]},
    zjq:{name:"总进球",labels:["0球","1球","2球","3球","4球","5球","6球","7+"]},
    bqc:{name:"半全场",labels:["胜胜","平胜","负胜","胜平","平平","负平","胜负","平负","负负"]}
};

// ============ TAB ============
function renderTabs() {
    var keys = Object.keys(ALL_DATA);
    var html = '';
    for (var k = 0; k < keys.length; k++) {
        var key = keys[k];
        var d = ALL_DATA[key];
        var cls = key === currentTab ? ' active' : '';
        html += '<button class="tab-btn'+cls+'" onclick="switchTab(\''+key+'\')">'+d.label+' <span class="count">('+d.matches.length+'场)</span></button>';
    }
    document.getElementById('tabBar').innerHTML = html;
}

function switchTab(key) {
    currentTab = key;
    renderTabs();
    renderAll();
    document.getElementById('headerDate').textContent = '20'+key.substring(2,4)+'年'+key.substring(5,7)+'月'+key.substring(8,10)+'日 '+ALL_DATA[key].weekday;
}

// ============ RENDER ============
function getModeSelectHTML(idx, dateKey) {
    var h = '<select class="mode-select" id="mode_'+dateKey+'_'+idx+'" onchange="onModeChange(\''+dateKey+'\','+idx+')">';
    for (var k in modes) { h += '<option value="'+k+'">'+modes[k].name+'</option>'; }
    return h + '</select>';
}

function getSpInputsHTML(m, idx, dateKey, mode) {
    if (!mode) mode = 'spf';

    if (mode === 'spf') {
        var labels = ['胜','平','负'];
        var html = '';
        for (var j = 0; j < 3; j++) {
            var v = m.spf[j];
            var cls = 'check-opt';
            html += '<label class="'+cls+'" id="opt_'+dateKey+'_'+idx+'_'+j+'" onclick="toggleCheck(this)">'+
                '<span class="label">'+labels[j]+'</span>'+
                '<span class="sp-val">'+(v>0?v.toFixed(2):'待定')+'</span>'+
                '</label>';
        }
        return html;
    }
    if (mode === 'rqspf') {
        var hcp = m.rqspf.h;
        var vals = m.rqspf.v;
        var prefix = hcp.charAt(0)==='+' ? '受让' : '让';
        var labels = [prefix+'胜'+hcp.replace('+',''), '让平', '让负'];
        var html = '';
        for (var j = 0; j < 3; j++) {
            var v = vals[j];
            var cls = 'check-opt';
            html += '<label class="'+cls+'" id="opt_'+dateKey+'_'+idx+'_'+j+'" onclick="toggleCheck(this)">'+
                '<span class="label" style="color:#e65100">'+labels[j]+'</span>'+
                '<span class="sp-val">'+(v>0?v.toFixed(2):'待定')+'</span>'+
                '</label>';
        }
        return html;
    }
    if (mode === 'bf') {
        return '<input class="sp-text-input" id="sp_'+dateKey+'_'+idx+'_score" placeholder="比分 如2:1">'+
               '<input class="sp-text-input" id="sp_'+dateKey+'_'+idx+'_sp" placeholder="SP值">';
    }
    if (mode === 'zjq') {
        var labels = ['0','1','2','3','4','5','6','7+'];
        var html = '';
        for (var j = 0; j < 8; j++) {
            html += '<label class="check-opt" id="opt_'+dateKey+'_'+idx+'_'+j+'" onclick="toggleCheck(this)">'+
                '<span class="label">'+labels[j]+'球</span>'+
                '<span class="sp-val" style="color:#999">待定</span>'+
                '</label>';
        }
        return html;
    }
    if (mode === 'bqc') {
        var labels = ['胜胜','平胜','负胜','胜平','平平','负平','胜负','平负','负负'];
        var html = '';
        for (var j = 0; j < 9; j++) {
            html += '<label class="check-opt" id="opt_'+dateKey+'_'+idx+'_'+j+'" onclick="toggleCheck(this)" style="font-size:10px">'+
                '<span class="label">'+labels[j]+'</span>'+
                '<span class="sp-val" style="color:#999">待定</span>'+
                '</label>';
        }
        return html;
    }
    return '';
}

function toggleCheck(el) {
    el.classList.toggle('selected');
}

function onModeChange(dateKey, idx) {
    var sel = document.getElementById('mode_'+dateKey+'_'+idx);
    var spCol = document.getElementById('spCol_'+dateKey+'_'+idx);
    var m = ALL_DATA[dateKey].matches[idx];
    spCol.innerHTML = getSpInputsHTML(m, idx, dateKey, sel.value);
}

// ============ BUILD ============
function renderAll() {
    var matches = ALL_DATA[currentTab].matches;
    var html = '';
    for (var i = 0; i < matches.length; i++) {
        var m = matches[i];
        html += '<div class="match-card" id="card_'+currentTab+'_'+i+'">'+
            '<div class="match-card-top">'+
                '<div class="chk-col"><input type="checkbox" class="match-check" id="chk_'+currentTab+'_'+i+'" onchange="updateCount();updateCardHighlight(this)"></div>'+
                '<div class="info-col">'+
                    '<div class="info-row1">'+
                        '<span class="match-id">'+m.id+'</span>'+
                        '<span class="match-league">'+m.league+'</span>'+
                    '</div>'+
                    '<div class="match-teams">'+m.home+' vs '+m.away+'</div>'+
                    '<div class="info-row2">'+
                        '<span class="match-time">'+m.time+'</span>'+
                        '<span class="match-note">'+m.note+'</span>'+
                    '</div>'+
                '</div>'+
            '</div>'+
            '<div class="mode-row">'+
                '<span style="font-size:11px;color:#888;flex-shrink:0;">玩法</span>'+
                getModeSelectHTML(i, currentTab)+
            '</div>'+
            '<div class="sp-row" id="spCol_'+currentTab+'_'+i+'">'+getSpInputsHTML(m, i, currentTab, 'spf')+'</div>'+
        '</div>';
    }
    document.getElementById('matchList').innerHTML = html;
    updateCount();
}

function updateCardHighlight(cb) {
    var card = cb.closest('.match-card');
    if (card) {
        if (cb.checked) card.classList.add('selected-card');
        else card.classList.remove('selected-card');
    }
}

// ============ SELECTION ============
function updateCount() {
    var allChecks = document.querySelectorAll('.match-check');
    var c = 0; for (var i = 0; i < allChecks.length; i++) { if (allChecks[i].checked) c++; }
    document.getElementById('selectedCount').textContent = '已选 '+c+' 场';
    document.getElementById('selectAll').checked = (c === allChecks.length && c > 0);
    document.querySelectorAll('.quick-btn').forEach(function(b){
        b.classList.remove('active');
        if (b.textContent === c+'串1') b.classList.add('active');
    });
}

function toggleAll() {
    var v = document.getElementById('selectAll').checked;
    document.querySelectorAll('.match-check').forEach(function(c){
        c.checked = v;
        var card = c.closest('.match-card');
        if (card) { if (v) card.classList.add('selected-card'); else card.classList.remove('selected-card'); }
    });
    updateCount();
}

function presetSelect(n) {
    document.querySelectorAll('.match-check').forEach(function(c,i){
        c.checked = i < n;
        var card = c.closest('.match-card');
        if (card) { if (i < n) card.classList.add('selected-card'); else card.classList.remove('selected-card'); }
    });
    document.getElementById('selectAll').checked = false;
    document.querySelectorAll('.quick-btn').forEach(function(b){
        b.classList.remove('active');
        if (b.textContent === n+'串1') b.classList.add('active');
    });
    updateCount();
}

// ============ CALCULATE ============
function calculate() {
    var checked = document.querySelectorAll('.match-check:checked');
    if (checked.length === 0) {
        document.getElementById('resultContent').innerHTML = '<p style="color:#d4213d;font-weight:600;">请至少勾选1场比赛</p>';
        return;
    }

    // 收集每场的选中选项
    var fieldOptions = [];
    var anyMissing = false;
    var missingList = [];

    checked.forEach(function(cb){
        var parts = cb.id.split('_');
        var dateKey = parts[1];
        var idx = parseInt(parts[2]);
        var m = ALL_DATA[dateKey].matches[idx];
        var modeEl = document.getElementById('mode_'+dateKey+'_'+idx);
        var mode = modeEl ? modeEl.value : 'spf';
        var modeName = modes[mode].name;
        var matchLabel = m.id+' '+m.home+'vs'+m.away;

        if (mode === 'bf') {
            var spEl = document.getElementById('sp_'+dateKey+'_'+idx+'_sp');
            var scoreEl = document.getElementById('sp_'+dateKey+'_'+idx+'_score');
            if (spEl) {
                var v = parseFloat(spEl.value);
                if (!isNaN(v) && v > 0) {
                    fieldOptions.push({match:matchLabel,modeName:modeName,options:[{label:(scoreEl&&scoreEl.value)?scoreEl.value:'比分',sp:v}]});
                } else {
                    anyMissing = true;
                    missingList.push('<span style="color:#999;">'+matchLabel+' ['+modeName+']：未输入有效SP</span>');
                }
            } else {
                anyMissing = true;
                missingList.push('<span style="color:#999;">'+matchLabel+' ['+modeName+']：未找到输入</span>');
            }
            return;
        }

        var spCol = document.getElementById('spCol_'+dateKey+'_'+idx);
        var selected = spCol ? spCol.querySelectorAll('.check-opt.selected') : [];
        if (selected.length === 0) {
            anyMissing = true;
            missingList.push('<span style="color:#999;">'+matchLabel+' ['+modeName+']：未选择选项</span>');
            return;
        }

        var opts = [];
        for (var si = 0; si < selected.length; si++) {
            var sel = selected[si];
            var spValEl = sel.querySelector('.sp-val');
            var spText = spValEl ? spValEl.textContent : '待定';
            var spVal = parseFloat(spText);
            var labelEl = sel.querySelector('.label');
            var label = labelEl ? labelEl.textContent : (si+1);
            if (isNaN(spVal) || spVal <= 0) {
                anyMissing = true;
                missingList.push('<span style="color:#999;">'+matchLabel+' ['+modeName+'] '+label+'：SP值待同步</span>');
                continue;
            }
            opts.push({label:label,sp:spVal});
        }
        if (opts.length > 0) {
            fieldOptions.push({match:matchLabel,modeName:modeName,options:opts});
        }
    });

    if (fieldOptions.length === 0) {
        document.getElementById('resultContent').innerHTML = '<p style="color:#d4213d;font-weight:600;">所有场次均未选择有效选项</p>';
        return;
    }

    // 笛卡尔积生成所有投注组合
    function cartesian(arr, prefix, idx) {
        if (idx >= arr.length) return [prefix.slice()];
        var results = [];
        var cur = arr[idx];
        for (var i = 0; i < cur.options.length; i++) {
            var np = prefix.slice();
            np.push({match:cur.match, modeName:cur.modeName, option:cur.options[i]});
            results = results.concat(cartesian(arr, np, idx+1));
        }
        return results;
    }
    var combos = cartesian(fieldOptions, [], 0);
    var n = fieldOptions.length;
    var passType = n === 1 ? '单关' : n+'串1';
    var totalCombos = combos.length;
    var needSplit = totalCombos > 1;

    // 构建结果
    var html = '<div style="margin-bottom:6px;">'+
        '<span class="badge badge-blue" style="font-size:14px;padding:4px 12px;">'+passType+'</span> '+
        '<span class="badge badge-red" style="font-size:12px;">混合串关</span> '+
        '<span style="font-size:12px;color:#888;margin-left:8px;">有效'+n+'场'+'</span>';
    if (needSplit) {
        html += ' <span class="badge" style="background:#e65100;color:#fff;font-size:12px;padding:2px 8px;">拆单 '+totalCombos+'注</span>';
    }
    html += '</div>';

    // 每注详情
    for (var ci = 0; ci < combos.length; ci++) {
        var combo = combos[ci];
        var spProd = 1;
        var lines = [];
        for (var fi = 0; fi < combo.length; fi++) {
            spProd *= combo[fi].option.sp;
            lines.push(combo[fi].match+' ['+combo[fi].modeName+'] '+combo[fi].option.label+' SP='+combo[fi].option.sp.toFixed(2));
        }
        html += '<div class="detail-line" style="margin-bottom:3px;">';
        if (needSplit) html += '<strong>注'+(ci+1)+'：</strong>';
        html += lines.join(' &rarr; ')+'<br>';
        html += 'SP乘积：<strong id="noteSP_'+ci+'">'+spProd.toFixed(4)+'</strong> | 奖金：<strong id="notePrize_'+ci+'">¥'+(2*spProd).toFixed(2)+'</strong>';
        if (2*spProd > 10000) html += ' <span style="color:#d4213d;font-size:10px;">(缴税)</span>';
        html += '</div>';
        if (ci < combos.length-1) html += '<hr style="border:0;border-top:1px dashed #e0e0e0;margin:3px 0;">';
    }

    // 汇总
    var totalCost = 2 * totalCombos;
    var minPrize = 1e9, maxPrize = 0;
    window._baseSPs = [];
    for (var ci2 = 0; ci2 < combos.length; ci2++) {
        var sp2 = 1;
        for (var fi2 = 0; fi2 < combos[ci2].length; fi2++) sp2 *= combos[ci2][fi2].option.sp;
        window._baseSPs.push(sp2);
        var p = 2 * sp2;
        if (p < minPrize) minPrize = p;
        if (p > maxPrize) maxPrize = p;
    }

    html += '<div class="result-box">';
    if (needSplit) {
        window._combos = combos;
        window._spProduct = null;
        html += '<div class="result-row"><span class="result-label">总注数</span><span class="result-value">'+totalCombos+'注 × 2元</span></div>';
        html += '<div class="result-row"><span class="result-label">总投入</span><span class="result-value" style="color:#d4213d;" id="totalCostDisp">¥'+totalCost.toFixed(2)+'</span></div>';
        html += '<div class="result-row"><span class="result-label">倍投</span><span class="result-value"><input type="number" id="multiplier" value="1" min="1" max="99" style="width:56px;padding:4px;text-align:center;border:1px solid #ddd;border-radius:4px;font-size:14px;" oninput="recalcMulti()"> 倍</span></div>';
        html += '<div class="result-row"><span class="result-label">最低奖金</span><span class="result-value" id="minPrizeDisp">¥'+minPrize.toFixed(2)+'</span></div>';
        html += '<div class="result-row total"><span>最高奖金</span><span id="maxPrizeDisp" style="color:#2e7d32;">¥'+maxPrize.toFixed(2)+'</span></div>';
        html += '<div class="result-row" style="color:#888;font-size:12px;"><span>全部猜中方中奖</span><span id="totalDisplay">投入 ¥'+totalCost.toFixed(2)+'</span></div>';
    } else {
        window._combos = null;
        var spProd2 = 1;
        for (var fi3 = 0; fi3 < combos[0].length; fi3++) spProd2 *= combos[0][fi3].option.sp;
        window._spProduct = spProd2;
        html += '<div class="result-row"><span class="result-label">SP乘积</span><span class="result-value" style="font-size:16px;">'+spProd2.toFixed(4)+'</span></div>';
        html += '<div class="result-row"><span class="result-label">单注金额</span><span class="result-value">¥2.00</span></div>';
        html += '<div class="result-row"><span class="result-label">倍投</span><span class="result-value"><input type="number" id="multiplier" value="1" min="1" max="99" style="width:56px;padding:4px;text-align:center;border:1px solid #ddd;border-radius:4px;font-size:14px;" oninput="recalcMulti()"> 倍</span></div>';
        html += '<div class="result-row total"><span>预计单注奖金</span><span id="prizeDisplay">¥'+(2*spProd2).toFixed(2)+'</span></div>';
        html += '<div class="result-row" style="color:#888;font-size:12px;"><span>'+(n===1?'单关返奖':'全部猜中方中奖')+'</span><span id="totalDisplay">投入 ¥2.00</span></div>';
        var taxNote = (2*spProd2)>10000 ? '<div style="color:#d4213d;font-size:11px;margin-top:4px;">单注奖金超1万元需缴20%偶然所得税</div>' : '';
        html += taxNote;
    }
    html += '</div>';

    if (anyMissing || missingList.length > 0) {
        html += '<div style="margin-top:8px;font-size:11px;color:#999;">'+missingList.join('<br>')+'</div>';
    }

    document.getElementById('resultContent').innerHTML = html;
}

function recalcMulti() {
    var mult = parseInt(document.getElementById('multiplier').value) || 1;
    if (window._combos) {
        // 多注模式：逐注更新奖金 + 汇总
        var newMin = 1e9, newMax = 0;
        for (var i = 0; i < window._combos.length; i++) {
            var sp = window._baseSPs ? window._baseSPs[i] : 1;
            var p = 2 * sp * mult;
            if (p < newMin) newMin = p;
            if (p > newMax) newMax = p;
            var nsp = document.getElementById('noteSP_'+i);
            var np = document.getElementById('notePrize_'+i);
            if (nsp) nsp.textContent = sp.toFixed(4);
            if (np) np.textContent = '¥'+p.toFixed(2);
        }
        document.getElementById('minPrizeDisp').textContent = '¥'+newMin.toFixed(2);
        document.getElementById('maxPrizeDisp').textContent = '¥'+newMax.toFixed(2);
        document.getElementById('totalCostDisp').textContent = '¥'+(2 * window._combos.length * mult).toFixed(2);
        document.getElementById('totalDisplay').textContent = '投入 ¥'+(2 * window._combos.length * mult).toFixed(2);
    } else if (window._spProduct !== undefined) {
        // 单注模式
        document.getElementById('prizeDisplay').textContent = '¥'+(2 * window._spProduct * mult).toFixed(2);
        document.getElementById('totalDisplay').textContent = '投入 ¥'+(2 * mult).toFixed(2);
    }
}

function resetAll() {
    document.querySelectorAll('.match-check').forEach(function(c){c.checked=false;});
    document.querySelectorAll('.match-card').forEach(function(card){card.classList.remove('selected-card');});
    document.getElementById('selectAll').checked = false;
    document.querySelectorAll('.quick-btn').forEach(function(b){b.classList.remove('active');});
    document.getElementById('selectedCount').textContent = '已选 0 场';
    renderAll();
    document.getElementById('resultContent').innerHTML = '<p class="tip">勾选场次、点选投注选项后点击「计算奖金」</p>';
    window._combos = null;
    window._spProduct = null;
}

// ============ INIT ============
renderTabs();
renderAll();
</script>
</body>
</html>
