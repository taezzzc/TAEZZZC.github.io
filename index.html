*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333;min-height:100vh;font-size:14px}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);color:#fff;padding:14px 12px;text-align:center;position:sticky;top:0;z-index:100}
.header h1{font-size:22px;font-weight:800;letter-spacing:2px}
.header .sub{font-size:10px;opacity:0.7;margin-top:2px}
.container{max-width:720px;margin:0 auto;padding:8px}
.today-picks{background:linear-gradient(135deg,#0d1b2a,#1b2838,#415a77);border-radius:12px;padding:12px;margin-bottom:10px;color:#e0e1dd}
.today-picks-title{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.today-picks-title::before{content:'★';color:#ffd700;font-size:18px}
.today-picks-list{display:flex;gap:8px;flex-wrap:wrap}
.tp-card{flex:1;min-width:130px;background:rgba(255,255,255,0.07);border-radius:8px;padding:10px;text-align:center;border:1px solid rgba(255,255,255,0.1)}
.tp-card .tp-teams{font-size:11px;font-weight:600;margin-bottom:4px}
.tp-card .tp-pick{font-size:18px;font-weight:800;color:#ffd700;margin:4px 0}
.tp-card .tp-sp{font-size:10px;opacity:0.7}
.tp-card .tp-conf{display:inline-block;font-size:8px;padding:1px 6px;border-radius:8px;margin-top:3px}
.tp-conf-high{background:#4caf50;color:#fff}
.tp-conf-mid{background:#ff9800;color:#fff}
.tp-conf-low{background:#666;color:#ccc}
.tab-bar{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:5px 9px;border:1px solid #ddd;background:#fff;border-radius:14px;font-size:10px;cursor:pointer;color:#666;white-space:nowrap;min-height:28px;transition:all .15s}
.tab-btn.active{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.quick-row{display:flex;gap:6px;align-items:center;font-size:12px;color:#666;flex-wrap:wrap;margin-bottom:6px}
.quick-row label{cursor:pointer;display:flex;align-items:center;gap:2px;font-size:12px}
.quick-row label input{width:14px;height:14px;accent-color:#d4213d}
.quick-btn{min-height:28px;border:1px solid #ddd;background:#fff;padding:3px 10px;border-radius:14px;font-size:11px;cursor:pointer;color:#666;white-space:nowrap;transition:all .15s}
.quick-btn.active{background:#d4213d;color:#fff;border-color:#d4213d}
.selected-count{font-size:12px;color:#d4213d;font-weight:600;margin-bottom:4px;background:#fff0f0;display:inline-block;padding:2px 10px;border-radius:10px}
.match-card{background:#fff;border:1px solid #eee;border-radius:8px;padding:10px;margin-bottom:8px;transition:all .2s}
.match-card.past-card{background:#fafafa;border-color:#e8e8e8;opacity:0.75}
.past-score{text-align:center;padding:8px 0;margin-bottom:8px;border-bottom:1px dashed #e0e0e0}
.past-score .final-score{font-size:24px;font-weight:800;color:#1a1a2e;letter-spacing:2px}
.past-score .ht-score{font-size:11px;color:#999;margin-top:2px}
.past-result-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:3px 0;padding:2px 4px}
.past-result-label{font-size:10px;color:#888;font-weight:700;min-width:36px}
.past-result-opts{display:flex;gap:4px;flex-wrap:wrap}
.past-opt{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:6px;font-size:10px;border:1px solid #e8e8e8;background:#f5f5f5;color:#bbb}
.past-opt.hit{background:#e8f5e9;color:#2e7d32;border-color:#a5d6a7;font-weight:700}
.past-opt.hit .past-sp{color:#2e7d32}
.match-card-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.match-card .chk-col{flex-shrink:0;padding-top:2px}
.match-card .chk-col input{width:18px;height:18px;accent-color:#d4213d;cursor:pointer}
.match-card .info-col{flex:1;min-width:0}
.match-card .info-row1{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.match-card .match-id{font-size:11px;font-weight:700;padding:2px 6px;border-radius:3px;flex-shrink:0;background:#f5f5f5}
.match-card .match-league{font-size:10px;color:#999}
.match-card .match-teams{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match-card .info-row2{display:flex;align-items:center;gap:8px;font-size:11px;flex-wrap:wrap}
.match-card .match-time{color:#d4213d;font-weight:600}
.match-card .match-note{color:#999;font-size:10px}
.match-card .info-row3{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.score-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.score-badge.high{background:#e8f5e9;color:#2e7d32}
.score-badge.mid{background:#fff3e0;color:#e65100}
.score-badge.low{background:#ffebee;color:#c62828}
.alert-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:10px;font-size:10px;font-weight:600}
.alert-hot{background:#ffebee;color:#d4213d}
.alert-cold{background:#e3f2fd;color:#1976d2}
.alert-none{background:#f5f5f5;color:#999}
.prob-badge{font-size:10px;padding:2px 6px;border-radius:8px;font-weight:600}
.prob-high{background:#e8f5e9;color:#2e7d32}
.prob-mid{background:#fff8e1;color:#f57f17}
.prob-low{background:#fce4ec;color:#c62828}
.match-card .mode-row{display:none}
.match-card .mode-select{display:none}
.match-card .sp-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-left:2px}
.sp-section{margin-bottom:3px;padding:3px 0}
.sp-section-label{font-size:10px;color:#999;font-weight:600;margin-bottom:1px;padding:0 4px}
.analysis-toggle{font-size:10px;color:#888;cursor:pointer;display:flex;align-items:center;gap:3px;margin-top:6px;padding:4px 8px;background:#f8f8f8;border-radius:6px;border:none;width:100%;text-align:left}
.analysis-toggle:hover{background:#eee}
.expand-btn{font-size:10px;color:#888;cursor:pointer;display:flex;align-items:center;gap:4px;margin-top:4px;padding:4px 8px;background:#fafafa;border-radius:6px;border:1px dashed #ddd;width:100%;text-align:left;transition:all .15s}
.expand-btn:hover{background:#f0f0f0;border-color:#bbb}
.expand-section{display:none;border-left:2px solid #e8e8e8;margin-left:6px;padding-left:6px}
.analysis-detail{display:none;margin-top:8px;padding:10px;background:#fafafa;border-radius:6px;font-size:11px;line-height:1.8}
.analysis-detail.show{display:block}
.analysis-table{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:8px}
.analysis-table th{background:#eee;padding:4px 6px;text-align:center;font-weight:600}
.analysis-table td{padding:4px 6px;text-align:center;border-bottom:1px solid #eee}
.analysis-box{display:none}.analysis-box.show{display:block}.analysis-section{padding:8px;margin:6px 0;border-radius:6px;background:#fafafa;font-size:11px;line-height:1.6}

.per-match-rec{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}

.footer{text-align:center;padding:14px;color:#999;font-size:10px}
.tip{font-size:12px;color:#999;margin-top:4px}
.source-note{font-size:9px;color:#bbb;margin-top:6px}

.bf-opt .sp-val{font-size:8px}

.expand-section{margin-left:2px;padding-left:4px}
.tp-card{min-width:100px;padding:8px}
.tp-card .tp-pick{font-size:14px}

function calcReturnRate(s){var sum=0;for(var i=0;i<3;i++)if(s[i]>0)sum+=1/s[i];return sum>0?1/sum:0}
function calcImpliedProb(s){var r=calcReturnRate(s);if(r===0)return[0,0,0];return s.map(function(o){return o>0?r/o:0})}
function euroToJcSP(o){return o.map(function(x){return x>0?+(x*0.71).toFixed(2):0})}
function analyzeHandicap(m){var r=m.rqspf;if(!r||r.v[0]===0)return{type:"no-data",text:"无数据"};var h=parseFloat(r.h);var rr=1/(1/r.v[0]+1/r.v[1]+1/r.v[2]);var p=[rr/r.v[0],rr/r.v[1],rr/r.v[2]];var cp=p[0];var cl=cp>0.55?"高":cp>0.4?"中":"低";return{type:"ok",handicap:h,coverProb:cp,coverLevel:cl,probs:p.map(function(x){return +(x*100).toFixed(1)})}}
function calcUpsetAlert(m){var s=m.spf;if(s[0]===0)return{level:0,text:"无数据",cls:"alert-none",reasons:[]};var p=calcImpliedProb(s);var as=0,rs=[];if(p[0]<0.4&&s[0]>2){as+=2;rs.push("主胜不被看好")}if(s[1]<3.2&&s[1]>0){as+=1;rs.push("平局SP偏低")}if(p[2]>0.3){as+=2;rs.push("客胜有空间")}var spR=Math.max(s[0],s[1],s[2])-Math.min(s[0],s[1],s[2]);if(spR<2&&s[0]>0){as+=1;rs.push("赔率胶着")}if(as>=4)return{level:2,text:"高冷门风险",cls:"alert-hot",reasons:rs};if(as>=2)return{level:1,text:"注意冷门",cls:"alert-cold",reasons:rs};return{level:0,text:"正常",cls:"alert-none",reasons:rs}}
function calcMatchScore(m){var s=m.spf;if(s[0]===0)return{score:0,level:"low",text:"待同步",details:[]};var sc=5,d=[];var rr=calcReturnRate(s);if(s[0]<1.4){sc+=2;d.push("超级热门+2")}else if(s[0]<1.8){sc+=1.5;d.push("明显优势+1.5")}else if(s[0]<2.2){sc+=0.5;d.push("略微优势+0.5")}if(rr>0.92){sc+=1.5;d.push("高返还率+1.5")}else if(rr>0.88){sc+=0.8;d.push("正常返还+0.8")}var spr=Math.max(s[0],s[2])-Math.min(s[0],s[2]);if(spr>5){sc+=1;d.push("方向明确+1")}else if(spr<1.5){sc-=1;d.push("高度胶着-1")}var rq=m.rqspf;if(rq&&rq.v[0]>0){var rqR=1/(1/rq.v[0]+1/rq.v[1]+1/rq.v[2]),rqP=rqR/rq.v[0];if(rqP>0.45&&rqP<0.55){sc+=0.5;d.push("盘口均衡+0.5")}}sc=Math.max(1,Math.min(10,Math.round(sc*10)/10));var lv=sc>=7?"high":sc>=4?"mid":"low";var tx=sc>=7?"优质赛事":sc>=4?"一般赛事":"谨慎对待";return{score:sc,level:lv,text:tx,details:d}}

else if(p[2]>0.35)rec.score={pick:"0-1 / 1-2",reason:"客队占优 "+(p[2]*100).toFixed(0)+"%胜率"};
else rec.score={pick:"1-1 / 2-1",reason:"格局开放"};

function getAnalysisHTML(m,dk,i){var ak=dk+'_'+i,a=ANALYSIS[ak];if(!a)return'<div class="analysis-box" id="analysis_'+dk+'_'+i+'"><div class="analysis-title">详细分析</div><div class="analysis-content">数据同步中，待SP和情报更新后生成...</div></div>';var u=a.upsetLevel,uc=u==="高"?"#c62828":u==="中"?"#e65100":"#4caf50";var h='';h+='<div class="analysis-box" id="analysis_'+dk+'_'+i+'"><div class="analysis-title">'+a.teams+' 详细分析</div><div class="analysis-content">';h+='<div class="analysis-section"><b>近期状态</b><br>主队：'+a.homeForm+'<br>客队：'+a.awayForm+'</div>';h+='<div class="analysis-section"><b>交锋记录</b><br>'+a.h2h+'</div>';h+='<div class="analysis-section"><b>伤病情报</b><br>'+a.injuries+'</div>';h+='<div class="analysis-section" style="background:#fff8e1;border-left:3px solid '+uc+'"><b>冷门预警：'+u+'风险</b><br>'+a.upsetReason+'</div>';h+='<div class="analysis-section"><b>综合研判</b><br>'+a.detail+'</div>';h+='<div class="analysis-section" style="background:#e8f5e9;border-left:3px solid #4caf50"><b>五维推荐</b><br>胜平负：<span style="color:#c62828;font-weight:700">'+a.spfRec+'</span> | 让球：<span style="color:#e65100;font-weight:700">'+a.rqspfRec+'</span> | 比分：<span style="color:#1565c0;font-weight:700">'+a.scoreRec+'</span><br>总进球：<span style="font-weight:700">'+a.zjqRec+'</span> | 半全场：<span style="font-weight:700">'+a.bqcRec+'</span></div></div></div>';return h}

function renderPastResult(m){var r=m.result;if(!r)return'<div style="font-size:11px;color:#999;padding:6px 0;">本场比赛已结束</div>';var h='';h+='<div class="past-score"><div class="final-score">'+r.score.replace("-"," : ")+'</div><div class="ht-score">（半场 '+r.htScore+'）</div></div>';var si=["胜","平","负"].indexOf(r.spf);h+='<div class="past-result-row"><span class="past-result-label">胜平负</span><span class="past-opt hit">'+r.spf+' <span class="past-sp">'+(si>=0&&m.spf[si]>0?m.spf[si].toFixed(2):'-')+'</span></span></div>';var ri=r.rqspf.endsWith("胜")?0:r.rqspf.endsWith("平")?1:2;h+='<div class="past-result-row"><span class="past-result-label">让球</span><span class="past-opt hit">'+r.rqspf+' <span class="past-sp">'+(m.rqspf.v[ri]>0?m.rqspf.v[ri].toFixed(2):'-')+'</span></span></div>';var zi=["0","1","2","3","4","5","6","7+"].indexOf(r.zjq);h+='<div class="past-result-row"><span class="past-result-label">总进球</span><span class="past-opt hit">'+r.zjq+'球 <span class="past-sp">'+(zi>=0&&m.zjq[zi]>0?m.zjq[zi].toFixed(2):'-')+'</span></span></div>';var bi=["胜胜","胜平","胜负","平胜","平平","平负","负胜","负平","负负"].indexOf(r.bqc);h+='<div class="past-result-row"><span class="past-result-label">半全场</span><span class="past-opt hit">'+r.bqc+' <span class="past-sp">'+(bi>=0&&m.bqc[bi]>0?m.bqc[bi].toFixed(2):'-')+'</span></span></div>';var bfIdx=["1:0","2:0","2:1","3:0","3:1","3:2","4:0","4:1","4:2","5:0","5:1","5:2","胜其他","0:0","1:1","2:2","3:3","平其他","0:1","0:2","1:2","0:3","1:3","2:3","0:4","1:4","2:4","0:5","1:5","2:5","负其他"].indexOf(r.bf);h+='<div class="past-result-row"><span class="past-result-label">比分</span><span class="past-opt hit">'+r.bf+' <span class="past-sp">'+(bfIdx>=0&&m.bf[bfIdx]>0?m.bf[bfIdx].toFixed(2):'-')+'</span></span></div>';return h}
function renderAll(){
var ms=ALL_DATA[currentTab].matches,h="",isPast=currentTab<td;
for(var i=0;i<ms.length;i++){
var m=ms[i],hs=m.spf[0]>0;
var up=hs?calcUpsetAlert(m):{level:0,text:"待同步",cls:"alert-none"};
var sc=hs?calcMatchScore(m):{score:0,level:"low",text:"待同步"};
var ha=hs?analyzeHandicap(m):{type:"no-data"};
var lc={欧罗巴:"#d4213d",挪超:"#1976d2",美职:"#e65100",巴甲:"#2e7d32",瑞超:"#b8860b",芬超:"#00838f",欧冠:"#6a1b9a",巴西杯:"#1b5e20"};
var badge="";
if(hs){badge+='<span class="score-badge '+sc.level+'">评分'+sc.score.toFixed(1)+'</span>';
if(up.level>=1)badge+='<span class="alert-badge '+(up.level>=2?'alert-hot':'alert-cold')+'">'+up.text+'</span>';
if(ha.type==='ok')badge+='<span class="prob-badge prob-'+(ha.coverLevel==='高'?'high':ha.coverLevel==='中'?'mid':'low')+'">穿盘'+(ha.coverProb*100).toFixed(0)+'%</span>'}
var chkHTML=isPast?'<span style="background:#c62828;color:#fff;font-size:10px;padding:2px 6px;border-radius:3px;display:inline-block;">已结束</span>':'<input type="checkbox" class="match-check" id="chk_'+currentTab+'_'+i+'" onchange="updateCount();updateCardHighlight(this)">';
h+='<div class="match-card'+(isPast?' past-card':'')+'" id="card_'+currentTab+'_'+i+'"><div class="match-card-top"><div class="chk-col">'+chkHTML+'</div><div class="info-col"><div class="info-row1"><span class="match-id" style="color:'+(lc[m.league]||"#666")+'">'+m.league.charAt(0)+m.id+'</span><span class="match-league">'+m.league+'</span></div><div class="match-teams">'+m.home+' vs '+m.away+'</div><div class="info-row2"><span class="match-time">'+m.time+'</span><span class="match-note">'+m.note+'</span></div>'+(hs?'<div class="info-row3">'+badge+'</div>':'')+'</div></div>';
if(hs&&!isPast){h+=renderSPSection(m,i,currentTab,'spf');h+=renderSPSection(m,i,currentTab,'rqspf');h+='<button class="expand-btn" onclick="toggleExpand(\''+currentTab+'\','+i+')"><span id="expandIcon_'+currentTab+'_'+i+'">+</span> 总进球 / 比分 / 半全场</button><div class="expand-section" id="expand_'+currentTab+'_'+i+'">'+renderSPSection(m,i,currentTab,'zjq')+renderSPSection(m,i,currentTab,'bf')+renderSPSection(m,i,currentTab,'bqc')+'</div>';h+='<button class="analysis-toggle" onclick="toggleAnalysis(\''+currentTab+'\','+i+')"><span id="toggleIcon_'+currentTab+'_'+i+'">▶</span> 查看详细分析（稳胆/博冷/比分/盘口/评分）</button>'+getAnalysisHTML(m,currentTab,i)}
else if(hs&&isPast){h+=renderPastResult(m)}
else{h+='<div style="font-size:10px;color:#999;margin-top:4px;">待同步：SP数据暂未更新</div>'}
h+='</div>'}
document.getElementById("matchList").innerHTML=h;updateCount();renderTodayPicks()}

function toggleAnalysis(dk,idx){var e=document.getElementById("analysis_"+dk+"_"+idx),ic=document.getElementById("toggleIcon_"+dk+"_"+idx);if(e.classList.contains("show")){e.classList.remove("show");ic.textContent="▶"}else{e.classList.add("show");ic.textContent="▼"}}
function toggleExpand(dk,idx){var e=document.getElementById("expand_"+dk+"_"+idx),ic=document.getElementById("expandIcon_"+dk+"_"+idx);if(e.style.display==="block"){e.style.display="none";ic.textContent="+"}else{e.style.display="block";ic.textContent="−"}}
function updateCardHighlight(cb){var c=cb.closest(".match-card");if(c)c.classList.toggle("selected-card",cb.checked)}
function renderTodayPicks(){if(!ALL_DATA[td]){document.getElementById('todayPicks').style.display='none';return}var ms=ALL_DATA[td].matches,h='';for(var i=0;i<ms.length;i++){var m=ms[i];if(m.spf[0]===0||m.result)continue;var rec=perMatchRecommendations(m,td,i);if(!rec.safe){continue}var sp=rec.safe.sp,conf=rec.safe.conf==='高'?'high':rec.safe.conf==='中'?'mid':'low';h+='<div class="tp-card"><div class="tp-teams">'+m.home+' vs '+m.away+'</div><div class="tp-pick">'+rec.safe.pick+'</div><div class="tp-sp">SP: '+sp.toFixed(2)+'</div><span class="tp-conf tp-conf-'+conf+'">'+(conf==='high'?'高胜率':conf==='mid'?'较稳':'可博')+'</span></div>'}document.getElementById('todayPicksList').innerHTML=h||'<div style="font-size:11px;opacity:0.6;text-align:center;padding:8px;">今日比赛SP待同步</div>';document.getElementById('todayPicks').style.display=h?'block':'none'}

function updateCount(){var cs=document.querySelectorAll(".match-check"),c=0;for(var i=0;i<cs.length;i++)if(cs[i].checked)c++;document.getElementById("selectedCount").textContent="已选 "+c+" 场"}

function calculate(){
var cks=document.querySelectorAll(".match-check:checked");
var validCks=[];for(var i=0;i<cks.length;i++){var card=cks[i].closest(".match-card");if(card&&!card.classList.contains("past-card"))validCks.push(cks[i])}
if(validCks.length===0){document.getElementById("resultContent").innerHTML='<p style="color:#d4213d;font-weight:600;">请至少选择1场比赛的选项</p>';return}
var fo=[],ml=[];
for(var ci=0;ci<validCks.length;ci++){
var cb=validCks[ci],ps=cb.id.split("_"),dk=ps[1],idx=parseInt(ps[2]),m=ALL_DATA[dk].matches[idx];
var lb=m.league.charAt(0)+m.id+" "+m.home+"vs"+m.away;
var card=cb.closest(".match-card"),allSel=card.querySelectorAll(".check-opt.selected");
if(allSel.length===0){ml.push(lb+": 未选择任何选项");continue}
var matchOptions=[];
for(var si=0;si<allSel.length;si++){
 var el=allSel[si],eid=el.id.split("_"),sec=eid[1],
 lab=el.querySelector(".label").textContent,
 spv=parseFloat(el.querySelector(".sp-val").textContent);
 var mn=sec==="spf"?"胜平负":sec==="rqspf"?"让球":sec==="bf"?"比分":sec==="zjq"?"总进球":"半全场";
 if(isNaN(spv)||spv<=0){ml.push(lb+" ["+mn+"] "+lab+": SP待同步");continue}
 matchOptions.push({label:lab,sp:spv,modeName:mn});
}
if(matchOptions.length>0) fo.push({match:lb,options:matchOptions});
}
if(fo.length===0){document.getElementById("resultContent").innerHTML='<p style="color:#d4213d;font-weight:600;">所有场次均未选择有效选项</p>'+(ml.length>0?'<div style="font-size:10px;color:#999;margin-top:4px;">'+ml.join("<br>")+"</div>":"");return}
var cmb=(function c(arr,px,ix){if(ix>=arr.length)return[px.slice()];var r=[];for(var j=0;j<arr[ix].options.length;j++){var np=px.slice();np.push({match:arr[ix].match,modeName:arr[ix].options[j].modeName,option:arr[ix].options[j]});r=r.concat(c(arr,np,ix+1))}return r})(fo,[],0);
var n=fo.length,tc=cmb.length,ns=tc>1,h='<div style="margin-bottom:6px;"><span style="background:#1a1a2e;color:#fff;font-size:13px;padding:4px 12px;border-radius:4px;">'+(n===1?"单关":n+"串1")+'</span> <span style="background:#d4213d;color:#fff;font-size:11px;padding:2px 8px;border-radius:4px;">混合串关</span> <span style="font-size:11px;color:#888;margin-left:8px;">有效'+n+'场</span>';
if(ns)h+=' <span style="background:#e65100;color:#fff;font-size:11px;padding:2px 8px;border-radius:4px;">拆单 '+tc+'注</span>';h+='</div>';
// Selected matches summary blocks
h+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">';
for(var si=0;si<fo.length;si++){var f=fo[si],mid=f.match.split(" ")[0],mteams=f.match.split(" ").slice(1).join(" ");var opsStr=f.options.map(function(o){return o.label+" SP:"+o.sp.toFixed(2)}).join(" / ");h+='<div style="background:#fff;border:1px solid #e0e0e0;border-radius:6px;padding:6px 10px;font-size:10px;line-height:1.7;min-width:80px;"><div style="font-weight:700;font-size:12px;color:#1a1a2e;">'+mid+'</div><div style="color:#666;">'+mteams+'</div><div style="color:#d4213d;font-weight:600;">'+opsStr+'</div></div>'}
h+='</div>';
var bs=[];
for(var ci2=0;ci2<cmb.length;ci2++){var sp=1;for(var fi=0;fi<cmb[ci2].length;fi++){sp*=cmb[ci2][fi].option.sp}bs.push(sp)}
var mc=2*tc,mn=Math.min.apply(null,bs.map(function(s){return 2*s})),mx=Math.max.apply(null,bs.map(function(s){return 2*s}));
h+='<div class="result-box">';window._combos=cmb;window._baseSPs=bs;
if(ns){h+='<div class="result-row"><span>总注数</span><span>'+tc+'注 × 2元</span></div><div class="result-row"><span>总投入</span><span style="color:#d4213d;" id="totalCostDisp">¥'+mc.toFixed(2)+'</span></div><div class="result-row"><span>倍投</span><span><input type="number" id="multiplier" value="1" min="1" max="99" style="width:56px;padding:4px;text-align:center;border:1px solid #ddd;border-radius:4px;font-size:14px;" oninput="recalcMulti()"> 倍</span></div><div class="result-row"><span>最低奖金</span><span id="minPrizeDisp">¥'+mn.toFixed(2)+'</span></div><div class="result-row total"><span>最高奖金</span><span id="maxPrizeDisp" style="color:#2e7d32;">¥'+mx.toFixed(2)+'</span></div><div style="font-size:11px;color:#888;">全部猜中方中奖 | 投入 ¥<span id="totalDisplay">'+mc.toFixed(2)+'</span></div>'}
else{h+='<div class="result-row"><span>SP乘积</span><span style="font-size:16px;">'+bs[0].toFixed(4)+'</span></div><div class="result-row"><span>单注金额</span><span>¥2.00</span></div><div class="result-row"><span>倍投</span><span><input type="number" id="multiplier" value="1" min="1" max="99" style="width:56px;padding:4px;text-align:center;border:1px solid #ddd;border-radius:4px;font-size:14px;" oninput="recalcMulti()"> 倍</span></div><div class="result-row total"><span>预计奖金</span><span id="prizeDisplay">¥'+mx.toFixed(2)+'</span></div><div style="font-size:11px;color:#888;">'+(n===1?"单关返奖":"全部猜中方中奖")+' | 投入 ¥<span id="totalDisplay">2.00</span></div>';if(mx>10000)h+='<div style="color:#d4213d;font-size:10px;margin-top:4px;">单注奖金超1万元需缴20%偶然所得税</div>'}
h+="</div>";if(ml.length>0)h+='<div style="margin-top:8px;font-size:10px;color:#999;">'+ml.join("<br>")+"</div>";document.getElementById("resultContent").innerHTML=h}

function recalcMulti(){var m=parseInt(document.getElementById("multiplier").value)||1;if(window._combos&&window._combos.length>1){var mn=1e9,mx=0;for(var i=0;i<window._combos.length;i++){var p=2*window._baseSPs[i]*m;if(p<mn)mn=p;if(p>mx)mx=p}document.getElementById("minPrizeDisp").textContent="¥"+mn.toFixed(2);document.getElementById("maxPrizeDisp").textContent="¥"+mx.toFixed(2);document.getElementById("totalCostDisp").textContent="¥"+(2*window._combos.length*m).toFixed(2);document.getElementById("totalDisplay").textContent=(2*window._combos.length*m).toFixed(2)}else{var sp=window._baseSPs?window._baseSPs[0]:1;document.getElementById("prizeDisplay").textContent="¥"+(2*sp*m).toFixed(2);document.getElementById("totalDisplay").textContent=(2*m).toFixed(2)}}

function resetAll(){document.querySelectorAll(".match-check").forEach(function(c){c.checked=false});document.querySelectorAll(".match-card").forEach(function(c){c.classList.remove("selected-card")});document.querySelectorAll(".check-opt").forEach(function(c){c.classList.remove("selected")});renderAll();document.getElementById("resultContent").innerHTML='<p class="tip">点击选项自动选场，选择后点击「计算奖金」</p>';window._combos=null;window._baseSPs=null}

renderTabs();renderAll();
</script>
</body>
</html>
